name: hipotez_ozet

on:
  push:
    paths: ["data/analiz/hipotez_defteri.md", "data/analiz/hipotez_duzeltme.json", "data/analiz/hipotez_ozet.py"]
  schedule:
    - cron: "50 0 * * *"   # 03:50 TR, gece güncellemesinden sonra
  workflow_dispatch:

concurrency:
  group: hipotez_ozet
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ozet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Özet tabloyu üret
        run: python3 -I data/analiz/hipotez_ozet.py
      - name: Değiştiyse kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/analiz/hipotez_ozet.md docs/data/hipotez_ozet.json
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "hipotez özeti güncellendi"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
