name: sib

on:
  push:
    paths: ["data/sib_ham/**"]
  workflow_dispatch:

concurrency:
  group: tjk-ana
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m tjk.sibparse
      - name: Kaydet
        run: |
          git config user.name "tjk-bot"
          git config user.email "tjk-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "SİB anlık görüntü işlendi $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
