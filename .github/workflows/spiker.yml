name: spiker
# Spiker anlatımı → yazı (tjk/spiker.py). Her 3 saatte bir: önce dünün eksikleri, sonra arşivden en yeniden geriye; çalıştırma başına en çok N video.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "en çok video"
        default: "120"
  schedule:
    - cron: "40 */3 * * *"
permissions:
  contents: write
concurrency:
  group: spiker
  cancel-in-progress: false
jobs:
  yaz:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null && pip install -q faster-whisper numpy
      - run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          ( while true; do sleep 600; git add data/spiker; git commit -qm "spiker (ara kayıt)"; for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 20 + 5)); done; done ) &
          python3 -m tjk.spiker calis ${{ github.event.inputs.n || '120' }} 2>&1 | grep -v "HF_TOKEN\|unauthenticated" | tail -80
          git add data/spiker; git commit -qm "spiker yazı" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 25 + 5)); done; exit 1
