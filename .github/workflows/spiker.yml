name: spiker
# Spiker anlatımı → yazı (tjk/spiker.py). Her 3 saatte bir, 2 paralel iş: önce dünün eksikleri, sonra arşivden en yeniden geriye; çalıştırma başına en çok N video.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "en çok video"
        default: "120"
      kosular:
        description: "belirli koşular (TARIH_HİP_KOŞU boşlukla); doluysa yalnız bunlar"
        default: ""
  schedule:
    - cron: "40 */3 * * *"
permissions:
  contents: write
concurrency:
  group: spiker-${{ github.event.inputs.kosular != '' && github.event.inputs.kosular != null && 'tek' || 'ana' }}
  cancel-in-progress: false
jobs:
  yaz:
    strategy:
      fail-fast: false
      matrix:
        pay: [0, 1]          # 2 paralel iş (6 Kasım 22:35, kullanıcı: hızlanalım) → ~1.900 video/gün
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null && pip install -q faster-whisper numpy
      - run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          ( while true; do sleep 600; git add data/spiker; git commit -qm "spiker (ara kayıt)"; for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 20 + 5)); done; done ) &
          if [ -n "${{ github.event.inputs.kosular }}" ]; then [ "${{ matrix.pay }}" = "0" ] && python3 -m tjk.spiker tek ${{ github.event.inputs.kosular }} 2>&1 | grep -v "HF_TOKEN\|unauthenticated" | tail -40; else
          python3 -m tjk.spiker calis ${{ github.event.inputs.n || '120' }} ${{ matrix.pay }} 2 2>&1 | grep -v "HF_TOKEN\|unauthenticated" | tail -80; fi
          git add data/spiker; git commit -qm "spiker yazı" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 25 + 5)); done; exit 1
