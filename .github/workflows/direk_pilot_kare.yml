name: direk_pilot_kare
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null && pip -q install numpy pandas
      - run: python3 tjk/direk_pilot_kare.py 2>&1 | tee /tmp/pilot.log
      - run: |
          cp /tmp/pilot.log data/direk_pilot_kare_log.txt
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add data/direk_pilot data/direk_pilot_kare_log.txt; git commit -qm "galop video pilot" || true
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 20 + 5)); done
