name: probe

on:
  workflow_dispatch:
  push:
    paths: ["data/probe_istek.txt"]

concurrency:
  group: tjk-probe
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tjk.calistir sayfaprobe
      - name: Kaydet
        run: |
          git config user.name "tjk-bot"
          git config user.email "tjk-bot@users.noreply.github.com"
          git add -A data/yabanci_ham
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "probe $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
