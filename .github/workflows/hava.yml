name: hava
on:
  push:
    paths: ["tjk/hava_cek.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p data/hava && python tjk/hava_cek.py 2>&1 | tee data/hava/log.txt; exit 0 2>&1 | tee data/hava/log.txt
      - name: Kaydet
        run: |
          git config user.name "tjk-bot"
          git config user.email "tjk-bot@users.noreply.github.com"
          git add -f data/hava
          git diff --cached --quiet && exit 0
          git commit -m "hava verisi (Open-Meteo)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
