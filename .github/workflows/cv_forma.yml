name: cv_forma
# T143-D at kimliği: forma + eyer rengi; sonuçlar data/cv_forma/
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cv:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
        timeout-minutes: 10
      - run: pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -q ultralytics opencv-python-headless scipy
        timeout-minutes: 15
      - run: |
          python3 tjk/cv_forma.py 2>&1 | tail -40
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add data/cv_forma; git commit -qm "cv pilot" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep 10; done; exit 1
