name: yabanci_foto

on:
  push:
    paths: ["data/yabanci_foto/*.png", "data/yabanci_foto/*.jpg", "data/yabanci_foto/*.jpeg", "data/yabanci_foto/*.webp"]
  workflow_dispatch:

concurrency:
  group: tjk-ana
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  isle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-tur
          pip install -q pillow pandas
          python -m tjk.yabanci_foto
      - name: Kaydet
        run: |
          git config user.name "tjk-bot"
          git config user.email "tjk-bot@users.noreply.github.com"
          git add -A data docs/data
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "Yabancı koşu görüntüleri işlendi $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
