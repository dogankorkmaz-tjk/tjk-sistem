name: tjk

on:
  schedule:
    - cron: "30 0 * * *"         # 03:30 TR  gece: dünün sonuçları geçmişe, canlı test skoru
    - cron: "15 6 * * *"         # 09:15 TR  sabah: bugünün programı + model + AGF
    - cron: "40 9 * * *"         # 12:40 TR  sabah tekrarı (son program/AGF)
    - cron: "*/20 10-21 * * *"   # 13:00-00:59 TR, 20 dakikada bir: AGF + biten koşuların sonuçları
    - cron: "5,10,15,25,30,35,45,50,55 10-21 * * *"   # arada 5 dakikada bir: yalnızca yarışa son 40 dk içindeyse AGF anlık görüntüsü (hızlı mod)
  push:
    paths: ["data/tjk_csv/**", "data/tjk_sonuc/**", "data/tjk_kron/**", "data/kosmaz/**", "data/canli_oran/**"]   # CSV yüklenince koşu bilgisi hemen işlenir
  workflow_dispatch:
    inputs:
      mod:
        description: "sabah / canli / gece / skor / hepsi / dene"
        default: "dene"

concurrency:
  group: tjk-${{ startsWith(inputs.mod, 'farkgecmis') && 'fark' || 'ana' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calis:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - name: Çalıştır
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          case "${{ github.event.schedule }}" in
            "30 0 * * *") MOD=gece ;;
            "15 6 * * *"|"40 9 * * *") MOD=sabah ;;
            "5,10,15,25,30,35,45,50,55 10-21 * * *") MOD=hizli ;;
            "") if [ "${{ github.event_name }}" = "push" ]; then MOD=canli; else MOD="${{ inputs.mod }}"; fi ;;
            *) MOD=canli ;;
          esac
          echo "mod: $MOD"
          set +e
          python -u -m tjk.calistir "$MOD" 2>&1 | tee /tmp/calistir.log
          RC=${PIPESTATUS[0]}
          echo "$RC" > /tmp/calistir.rc
          python -W ignore -I data/analiz/abd_oto_degerlendir.py || echo "oto değerlendirme atlandı"
          python -I data/analiz/abd_kayit_degerlendir.py || echo "kayıt değerlendirme atlandı"
          exit 0
      - name: Kaydet
        run: |
          git config user.name "tjk-bot"
          git config user.email "tjk-bot@users.noreply.github.com"
          mkdir -p data docs/data data/log
          # hata olduysa ayrıntısı depoya yazılır (Actions günlüğü dışarıdan okunamıyor); olmadıysa eski hata dosyası silinir
          if [ "$(cat /tmp/calistir.rc 2>/dev/null || echo 0)" != "0" ]; then
            { echo "mod hata kodu: $(cat /tmp/calistir.rc)  $(date -u '+%Y-%m-%d %H:%M') UTC"; grep -n -A30 "Traceback" /tmp/calistir.log | head -80; echo "--- son satırlar ---"; tail -n 25 /tmp/calistir.log; } > data/log/son_hata.txt
          else
            rm -f data/log/son_hata.txt
          fi
          git add -A data docs
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "veri $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          # çakışma sürerse (aynı anda iki çalışma): bot dosyaları sonraki çalışmada yeniden üretildiğinden bu çalışmanın sürümü esas alınır
          git pull --rebase -X theirs && git push && exit 0
          exit 1
      - name: Sonuç
        if: always()
        run: |
          RC=$(cat /tmp/calistir.rc 2>/dev/null || echo 0)
          if [ "$RC" != "0" ]; then echo "tjk.calistir hata kodu $RC (ayrıntı data/log/son_hata.txt)"; exit 1; fi
