name: tjk

on:
  schedule:
    - cron: "30 0 * * *"         # 03:30 TR  gece: dünün sonuçları geçmişe, canlı test skoru
    - cron: "15 6 * * *"         # 09:15 TR  sabah: bugünün programı + model + AGF
    - cron: "40 9 * * *"         # 12:40 TR  sabah tekrarı (son program/AGF)
    - cron: "*/20 10-21 * * *"   # 13:00-00:59 TR, 20 dakikada bir: AGF + biten koşuların sonuçları
  workflow_dispatch:
    inputs:
      mod:
        description: "sabah / canli / gece / skor / hepsi / dene"
        default: "dene"

concurrency:
  group: tjk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Çalıştır
        run: |
          case "${{ github.event.schedule }}" in
            "30 0 * * *") MOD=gece ;;
            "15 6 * * *"|"40 9 * * *") MOD=sabah ;;
            "") MOD="${{ inputs.mod }}" ;;
            *) MOD=canli ;;
          esac
          echo "mod: $MOD"
          python -m tjk.calistir "$MOD"
      - name: Kaydet
        run: |
          git config user.name "tjk-bot"
          git config user.email "tjk-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "veri $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
