name: atyarisi_probe9
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests && python -u tjk/atyarisi_probe9.py
      - run: |
          git config user.name tjk-bot; git config user.email tjk-bot@users.noreply.github.com
          git add -A data; git diff --cached --quiet && exit 0
          git commit -m "atyarisi api sonda"; for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
