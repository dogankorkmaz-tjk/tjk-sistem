name: video_kare
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
      - name: kareler
        run: |
          mkdir -p data/video_ornek/hip /tmp/v
          for V in 26102422 26102452 26102482 26102642 26102662 26102172 26102512 26102532; do
            Y="20${V:0:2}/${V:2:2}"
            curl -s -m 120 -A "Mozilla/5.0" -e "https://www.tjk.org/" -o /tmp/v/x.mp4 "https://video-cdn.tjk.org/videoftp/$Y/${V}_m.mp4" || continue
            ffmpeg -v error -y -ss 4 -i /tmp/v/x.mp4 -frames:v 1 data/video_ornek/hip/${V}_a.png || true
            ffmpeg -v error -y -ss 60 -i /tmp/v/x.mp4 -frames:v 1 data/video_ornek/hip/${V}_b.png || true
            D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/v/x.mp4); ffmpeg -v error -y -ss $(python3 -c "print(max(0,float('$D')-6))") -i /tmp/v/x.mp4 -frames:v 1 data/video_ornek/hip/${V}_c.png || true
          done
      - name: kaydet
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add data/video_ornek && git commit -qm "hipodrom örnek kareleri" && git pull --rebase -q && git push -q
