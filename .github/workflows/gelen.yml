name: gelen

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: tjk-ana
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  isle:
    if: startsWith(github.event.release.tag_name, 'gelen')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils ffmpeg
          pip install -q numpy pillow scipy pandas
      - name: Dosyaları indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gelen
          gh release download "${{ github.event.release.tag_name }}" -D /tmp/gelen
          ls /tmp/gelen | wc -l
      - name: İşle
        env:
          ACIKLAMA: ${{ github.event.release.body }}
        run: |
          HIP=$(echo "$ACIKLAMA" | head -1 | awk '{print $1}')
          python -m tjk.gelen /tmp/gelen "$HIP" | tee /tmp/gelen_log.txt
      - name: Kaydet
        run: |
          git config user.name "tjk-bot"
          git config user.email "tjk-bot@users.noreply.github.com"
          git add -A data docs/data
          if git diff --cached --quiet; then echo "değişiklik yok"; else
            git commit -m "Gelen dosyalar işlendi ($(grep -c . /tmp/gelen_log.txt) satır)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
      - name: Sürümü sil
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.event.release.tag_name }}" --cleanup-tag -y
