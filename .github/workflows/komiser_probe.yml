name: komiser_probe
# Tek seferlik: komiser raporu PDF'inin içeriğini görmek (nazik: 3 istek). Sonuç data/gozlem/komiser/
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pdfplumber
      - run: |
          mkdir -p data/gozlem/komiser/ornek
          for u in 2026/202611094 2026/202611096 2026/202611081; do
            curl -sS -A "Mozilla/5.0 (tjk-sistem arastirma)" -o data/gozlem/komiser/ornek/$(basename $u).pdf -w "$u %{http_code} %{size_download}\n" https://medya-cdn.tjk.org/raporftp/YarisBilgileri/$u.pdf | tee -a data/gozlem/komiser/probe_log.txt
            sleep 5
          done
          python3 - <<'PY' 2>/dev/null | tee data/gozlem/komiser/ornek_metin.txt | head -150
          import pdfplumber,glob
          for f in sorted(glob.glob("data/gozlem/komiser/ornek/*.pdf")):
              try:
                  p=pdfplumber.open(f); print("=====",f,len(p.pages),"sayfa")
                  for pg in p.pages: print(pg.extract_text() or "")
              except Exception as e: print("HATA",f,e)
          PY
      - run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add data/gozlem/komiser; git commit -qm "komiser probe" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 20 + 5)); done; exit 1
