name: abd_canli

on:
  schedule:
    - cron: "0,30 9-23,0-3 * * *"   # her 30 dk bir iş başlar; iş 29 dk boyunca 4 dk'da bir kendisi yeniler (GitHub'ın */5 cron'u 30-40 dk gecikiyordu)
  workflow_dispatch:
  push:
    paths: ["data/abd_istek.txt"]     # siteden "Yenile" ile tetiklenir

concurrency:
  group: tjk-abd-canli-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calis:
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - name: Canlı döngü
        env:
          OLAY: ${{ github.event_name }}
        run: |
          git config user.name "tjk-bot"
          git config user.email "tjk-bot@users.noreply.github.com"
          if [ "$OLAY" = "schedule" ]; then N=8; else N=1; fi
          for i in $(seq 1 $N); do
            BAS=$(date +%s)
            python -m tjk.calistir abdcanli || true
            git add -A docs/data/abd.json docs/data/muh_canli.json docs/data/ga.json data/yabanci_ham/sl_canli_ornek.json data/abd_oto data/muh docs/data/supriz_canli.json data/supriz/canli
            git add -A data/muh_geri.txt 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "ABD canlı oranlar $(date -u '+%H:%M') UTC"
              for k in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep 8; done
            fi
            [ "$i" -lt "$N" ] || break
            GEC=$(( $(date +%s) - BAS )); BEK=$(( 225 - GEC )); if [ "$BEK" -gt 20 ]; then python -m tjk.muhtemeller yakin $(( BEK - 8 )) || sleep $BEK; fi
          done
