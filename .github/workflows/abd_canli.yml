name: abd_canli

on:
  schedule:
    - cron: "*/5 16-23,0-3 * * *"   # ABD yarış saatleri (UTC); 5 dakikada bir
    - cron: "*/5 9-15 * * *"        # İngiltere/İrlanda/Fransa gündüz koşuları (UTC)
  workflow_dispatch:
  push:
    paths: ["data/abd_istek.txt"]     # siteden "Yenile" ile tetiklenir

concurrency:
  group: tjk-abd-canli
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tjk.calistir abdcanli
      - name: Kaydet
        if: always()
        run: |
          git config user.name "tjk-bot"
          git config user.email "tjk-bot@users.noreply.github.com"
          git add -A docs/data/abd.json docs/data/ga.json data/yabanci_ham/sl_canli_ornek.json
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "ABD canlı oranlar $(date -u '+%H:%M') UTC"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done
          exit 1
