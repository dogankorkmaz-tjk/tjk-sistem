name: atyarisi_arsiv
on:
  schedule:
    - cron: "40 0 * * *"     # 03:40 TR: dünün tam sonuçları
    - cron: "20 6 * * *"     # 09:20 TR: bugünün programı
  workflow_dispatch:
    inputs:
      mod:
        description: "derinlik / gun / geri"
        default: "derinlik"
      bas:
        default: "2026-01-01"
      bit:
        default: "2026-10-22"
      max:
        default: "100"
concurrency:
  group: atyarisi-arsiv
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  a:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Çalıştır
        run: |
          set +e
          case "${{ github.event.schedule }}" in
            "40 0 * * *") python -u -m tjk.atyarisi_arsiv gun $(date -u -d 'yesterday' +%F) ;;
            "20 6 * * *") python -u -m tjk.atyarisi_arsiv gun $(TZ=Europe/Istanbul date +%F) ;;
            *) if [ "${{ inputs.mod }}" = "geri" ]; then python -u -m tjk.atyarisi_arsiv geri "${{ inputs.bas }}" "${{ inputs.bit }}" "${{ inputs.max }}"; elif [ "${{ inputs.mod }}" = "gun" ]; then python -u -m tjk.atyarisi_arsiv gun; else python -u -m tjk.atyarisi_arsiv derinlik; fi ;;
          esac
          exit 0
      - name: Kaydet
        if: always()
        run: |
          git config user.name tjk-bot; git config user.email tjk-bot@users.noreply.github.com
          git add -A data; git diff --cached --quiet && exit 0
          git commit -m "atyarisi arşiv $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
      - name: Zincir (geri doldurma bitmediyse sıradaki partiyi başlat)
        if: always() && inputs.mod == 'geri'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEDEF="${{ inputs.bas }}"
          ILK=$(ls data/atyarisi | sed 's/.json.gz//' | sort | head -1)
          echo "en eski arşiv günü: $ILK, hedef: $HEDEF"
          if [ -n "$HEDEF" ] && [[ "$ILK" > "$HEDEF" ]]; then
            SON=$(date -u -d "$ILK - 1 day" +%F)
            gh workflow run atyarisi_arsiv.yml -f mod=geri -f bas="$HEDEF" -f bit="$SON" -f max=100
          fi
