name: accurace

on:
  push:
    paths: ["data/accurace_ham/**"]
  workflow_dispatch:

concurrency:
  group: tjk-ana
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  isle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Var mı?
        id: v
        run: |
          if ls data/accurace_ham/*.png >/dev/null 2>&1; then echo "var=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.var == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          pip install -q numpy pillow pandas
          python -m tjk.gelen data/accurace_ham | tee /tmp/acc_log.txt
      - if: steps.v.outputs.var == '1'
        name: Kaydet
        run: |
          git rm -q data/accurace_ham/*.png
          git config user.name "tjk-bot"
          git config user.email "tjk-bot@users.noreply.github.com"
          git add -A data
          git commit -m "Accurace koşuları işlendi ($(grep -c . /tmp/acc_log.txt) satır)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
