name: t200
# T200 (data/analiz/t200.py): altılı AGF+PM0 karışımı; sonuç data/analiz/t200_sonuc.txt
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  t200:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python3 data/analiz/t200.py 2>&1 | tee data/analiz/t200_sonuc.txt | tail -60
      - run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add data/analiz/t200_sonuc.txt data/analiz/t200.json data/analiz/t200_altili.csv; git commit -qm "T200 sonuç" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 20 + 5)); done; exit 1
