name: yabanci

on:
  workflow_dispatch:
    inputs:
      mod:
        description: "yabanci / abdgecmis:bas:son / abdprogram:bas:son / slprobe:tarih"
        default: "yabanci"

concurrency:
  group: tjk-yabanci          # ana iş akışını (canlı/gece) bekletmesin diye ayrı grup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tjk.calistir "${{ inputs.mod }}"
      - name: Kaydet
        if: always()
        run: |
          git config user.name "tjk-bot"
          git config user.email "tjk-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "yabancı veri $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done
          exit 1
