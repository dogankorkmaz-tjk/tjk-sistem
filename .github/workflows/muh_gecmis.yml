name: muh_gecmis
on:
  workflow_dispatch:
    inputs:
      bas:
        description: "başlangıç günü (YYYY-MM-DD)"
        required: true
      bit:
        description: "bitiş günü"
        required: true
concurrency:
  group: muh-gecmis
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  calis:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests curl_cffi
      - run: python -m tjk.muh_gecmis
        env:
          MUH_BAS: ${{ inputs.bas }}
          MUH_BIT: ${{ inputs.bit }}
      - name: Kaydet
        if: always()
        run: |
          git config user.name "tjk-bot"
          git config user.email "tjk-bot@users.noreply.github.com"
          git add -A data/muh_gecmis
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "muh_gecmis ${{ inputs.bas }}..${{ inputs.bit }}"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; git rebase --abort 2>/dev/null; sleep 8; done
          exit 1
