        <!-- Capture fbclid into the _fbc cookie on landing, before GTM loads, so the
             Meta pixel and the server container both see the click id. -->
        <script>
            ;(function () {
                try {
                    var params = new URLSearchParams(window.location.search)
                    var fbclid = params.get('fbclid')
                    if (!fbclid) return
                    if (document.cookie.indexOf('_fbc=') > -1) return

                    var host = location.hostname
                    var domain = ''
                    if (!/^[\d.]+$/.test(host)) {
                        var parts = host.split('.')
                        if (parts.length > 2) {
                            var last2 = parts.slice(-2).join('.')
                            var keep = /^(co|org|net|gov|ac|edu)\.(za|uk|nz|au|in|ke)$/.test(last2) ? 3 : 2
                            domain = '; domain=.' + parts.slice(-keep).join('.')
                        }
                    }

                    document.cookie = '_fbc=fb.1.' + Date.now() + '.' + fbclid + '; max-age=7776000; path=/' + domain + '; SameSite=Lax'
                } catch (e) {}
            })()
        </script>
